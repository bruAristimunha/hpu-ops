name: cpu

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        torch: ["torch==2.6.0", "torch"]  # Gaudi's torch, and the latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "${{ matrix.torch }}" --index-url https://download.pytorch.org/whl/cpu
      - run: pip install pytest numpy
      - run: python -m pytest tests/test_cpu.py -q
